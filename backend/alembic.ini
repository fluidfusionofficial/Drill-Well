# Alembic configuration file
# Generated for NWIS backend.  Async migrations use asyncpg via env.py;
# the sqlalchemy.url here is a fallback / used by alembic's own CLI helpers.

[alembic]
# Path to the migration scripts directory
script_location = alembic

# Template used to generate migration file names.
# %(rev)s  - revision id
# %(slug)s - hook-friendly truncated message
# %(year)d, %(month).2d, %(day).2d - date parts
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sys.path manipulation for env.py
# prepend_sys_path = .

# Timezone used when generating the migration file timestamp
# timezone =

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be
# detected as revisions in the versions/ directory.
# sourceless = false

# Version path separator; set to use os.pathsep.
# version_path_separator = os  # Use os.pathsep.
# version_path_separator = :
# version_path_separator = ;
# version_path_separator = space
version_path_separator = os

# The sqlalchemy.url is overridden in alembic/env.py using SYNC_DATABASE_URL
# from the environment.  This placeholder prevents alembic from erroring when
# the env var is not set during config-file-only operations (e.g. --help).
sqlalchemy.url = postgresql+psycopg2://nwis:nwis_dev@localhost:5432/nwis

[post_write_hooks]
# Post-write hooks: ruff format generated migration files.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
