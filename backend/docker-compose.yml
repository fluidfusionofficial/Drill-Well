version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nwis_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nwis
      POSTGRES_USER: nwis
      POSTGRES_PASSWORD: nwis_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwis -d nwis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: nwis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: nwis_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nwis:nwis_dev@db:5432/nwis
      SYNC_DATABASE_URL: postgresql+psycopg2://nwis:nwis_dev@db:5432/nwis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  worker:
    build: .
    container_name: nwis_worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=4
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nwis:nwis_dev@db:5432/nwis
      SYNC_DATABASE_URL: postgresql+psycopg2://nwis:nwis_dev@db:5432/nwis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

volumes:
  pgdata:
    driver: local
