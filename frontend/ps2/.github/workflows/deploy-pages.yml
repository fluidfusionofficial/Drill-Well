name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping queued ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # This repo is a project site (github.io/samdanielrailway/monitor),
          # so assets must be served from /monitor. Override the repo variable
          # only if you later move the app to a user/org site or rename the repo.
          BASE_PATH: ${{ vars.BASE_PATH || '/monitor' }}

      - uses: actions/configure-pages@v5
        with:
          # Enables GitHub Pages for this repo on first run, so no manual
          # "Settings -> Pages" step is required.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
